name: WC26 Pipeline (Fetch + Scoring)

on:
  schedule:
    - cron: "*/5 * * * *"  # co 5 minut

  workflow_dispatch:  # ręczne odpalenie z GitHuba

jobs:
  pipeline:
    runs-on: ubuntu-latest

    steps:
      # 1. pobranie repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Python setup
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # 3. instalacja zależności
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Fetch matches (UPDATE SUPABASE MATCHES)
      - name: Fetch matches
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
        run: |
          cd app
          python -m services.fetch_matches

      # 5. Score bets (UPDATE BETS)
      - name: Score bets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          cd app
          python -m app.services.score_bets