name: Update Database for Matches and Bet-Points

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Fetch matches
        run: |
          python -m app.services.fetch_matches

      - name: Score bets
        run: |
          python -m app.services.score_bets